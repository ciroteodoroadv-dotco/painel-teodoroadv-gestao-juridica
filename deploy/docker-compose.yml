# Base de produção: NENHUMA porta publicada. O acesso externo virá só pelo túnel (marco M5).
name: painel

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: painel
      POSTGRES_DB: painel
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [banco]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel -d painel"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${PAINEL_IMAGE:-painel-app:latest} # em produção vem do registro, por digest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PAINEL_ADDR: ":8080"
      PAINEL_LOG_LEVEL: info
      # Produção exige o Cloudflare Access (preenchidos no M5). Vazio = o app recusa iniciar.
      PAINEL_ACCESS_TEAM_DOMAIN: ${PAINEL_ACCESS_TEAM_DOMAIN:-}
      PAINEL_ACCESS_AUD: ${PAINEL_ACCESS_AUD:-}
      PAINEL_PUBLIC_URL: ${PAINEL_PUBLIC_URL:-} # ex.: https://painel.seudominio.com.br
      PAINEL_DB_HOST: db
      PAINEL_DOCS_DIR: /data/documentos
      PAINEL_DB_NAME: painel
      PAINEL_DB_USER: painel
      PAINEL_DB_PASSWORD_FILE: /run/secrets/db_password
      PAINEL_DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      PAINEL_SESSION_KEY_FILE: /run/secrets/session_key
      PAINEL_FIELD_KEY_FILE: /run/secrets/field_key
    secrets: [db_password, db_app_password, session_key, field_key]
    networks: [banco, borda]
    read_only: true
    volumes: [docs:/data/documentos] # documentos cifrados; o resto do sistema de arquivos é somente leitura
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/painel", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  banco:
    internal: true # sem saída para a internet; só app e db conversam aqui
  borda: {}

volumes:
  pgdata:
  docs:

secrets:
  db_password: { file: ./secrets/db_password }
  db_app_password: { file: ./secrets/db_app_password }
  session_key: { file: ./secrets/session_key }
  field_key: { file: ./secrets/field_key }
