# Só para desenvolvimento no seu computador: publica a porta APENAS em 127.0.0.1 (loopback)
# e liga o modo dev (sem Cloudflare Access). Nunca use em servidor.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  migrate:
    environment:
      PAINEL_ENV: dev
      PAINEL_PUBLIC_URL: http://localhost:${PAINEL_DEV_PORT:-18080}
  app:
    environment:
      PAINEL_ENV: dev
      PAINEL_PUBLIC_URL: http://localhost:${PAINEL_DEV_PORT:-18080}
    ports:
      - "127.0.0.1:${PAINEL_DEV_PORT:-18080}:8080"
