{{define "content"}}{{with .Data}}
<h1>{{if .IsNew}}Nova pessoa{{else}}Editar pessoa{{end}}</h1>
{{end}}
{{if .Error}}<p class="erro" role="alert">{{.Error}}</p>{{end}}
{{with .Data}}
<form method="post" action="{{if .IsNew}}/pessoas{{else}}/pessoas/{{.ID}}{{end}}" data-protege class="grade">
  <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
  {{if not .IsNew}}<input type="hidden" name="version" value="{{.Version}}">{{end}}

  <div><label for="tipo">Tipo</label>
    <select id="tipo" name="tipo" required>
      <option value="PF" {{if eq .In.Tipo "PF"}}selected{{end}}>Pessoa física</option>
      <option value="PJ" {{if eq .In.Tipo "PJ"}}selected{{end}}>Pessoa jurídica</option>
    </select></div>
  <div><label for="papel">Papel</label>
    <select id="papel" name="papel" required>
      {{$p := .In.Papel}}{{range .Papeis}}<option value="{{.Valor}}" {{if eq .Valor $p}}selected{{end}}>{{.Rotulo}}</option>{{end}}
    </select></div>
  <div class="larga"><label for="nome">Nome</label>
    <input id="nome" name="nome" value="{{.In.Nome}}" required minlength="2" maxlength="200" autofocus></div>
  <div><label for="documento">CPF / CNPJ <small class="apoio">(opcional; guardado cifrado)</small></label>
    <input id="documento" name="documento" value="{{.In.Documento}}" inputmode="numeric" autocomplete="off"></div>
  <div><label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" value="{{.In.Telefone}}" inputmode="tel" autocomplete="off"></div>
  <div class="larga"><label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{.In.Email}}" maxlength="200" autocomplete="off"></div>
  <div><label for="retencao_ate">Guardar até <small class="apoio">(retenção, opcional)</small></label>
    <input id="retencao_ate" name="retencao_ate" type="date" value="{{.In.RetencaoAte}}"></div>

  <div class="larga"><button type="submit">Salvar</button>
    <a class="botao secundario" href="{{if .IsNew}}/pessoas{{else}}/pessoas/{{.ID}}{{end}}">Cancelar</a></div>
</form>
{{end}}{{end}}
