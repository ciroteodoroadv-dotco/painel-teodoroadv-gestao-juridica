{{define "ticker"}}{{if .Itens}}{{range .Itens}}<span class="idxt-item" title="{{.Titulo}}">{{.Rotulo}}<b>{{.Valor}}</b>{{if .Velho}} <em class="idxt-velho">desatualizado</em>{{end}}</span>{{end}}<span class="idxt-status">Ref.: {{.Ref}} · {{.Estado}}{{if .Velho}} · desatualizado{{end}}</span>{{else}}<span class="idxt-status">Índices econômicos: {{.Estado}}{{if .Mensagem}} — {{.Mensagem}}{{end}}</span>{{end}}{{end}}
