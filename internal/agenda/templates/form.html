{{define "content"}}
{{if .Error}}<p class="erro" role="alert">{{.Error}}</p>{{end}}
{{with .Data}}
<p class="apoio">Data e hora no horário de Brasília. O sistema não calcula prazo: registre a data que você definiu.</p>
<form method="post" action="{{if .IsNew}}/agenda{{else}}/agenda/{{.ID}}{{end}}" data-protege class="grade">
  <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
  {{if not .IsNew}}<input type="hidden" name="version" value="{{.Version}}">{{end}}
  <div><label for="tipo">Tipo</label>
    <select id="tipo" name="tipo" required>
      {{$t := .In.Tipo}}{{range .Tipos}}<option value="{{.Valor}}" {{if eq .Valor $t}}selected{{end}}>{{.Rotulo}}</option>{{end}}
    </select></div>
  <div class="larga"><label for="titulo">Título</label>
    <input id="titulo" name="titulo" value="{{.In.Titulo}}" required minlength="2" maxlength="300" autofocus></div>
  <div><label for="inicio">Início</label>
    <input id="inicio" name="inicio" type="datetime-local" value="{{.In.Inicio}}" required></div>
  <div><label for="fim">Término <small class="apoio">(opcional)</small></label>
    <input id="fim" name="fim" type="datetime-local" value="{{.In.Fim}}"></div>
  <div class="larga"><label for="local">Local ou link <small class="apoio">(opcional)</small></label>
    <input id="local" name="local" value="{{.In.Local}}" maxlength="500"></div>
  <div><label for="responsavel_id">Responsável</label>
    <select id="responsavel_id" name="responsavel_id">
      <option value="">— sem responsável —</option>
      {{$r := .In.ResponsavelID}}{{range .Responsaveis}}<option value="{{.Valor}}" {{if eq .Valor $r}}selected{{end}}>{{.Rotulo}}</option>{{end}}
    </select></div>
  <div><label for="busca">Processo <small class="apoio">(opcional)</small></label>
    <input id="busca" name="busca" type="search" autocomplete="off" placeholder="buscar por número ou órgão"
           hx-get="/agenda/processos" hx-trigger="input changed delay:300ms, search" hx-target="#processo_id">
    <select id="processo_id" name="processo_id">
      {{if .In.ProcessoID}}<option value="{{.In.ProcessoID}}" selected>{{.ProcessoNum}}</option>{{end}}
      <option value="">— sem processo —</option>
    </select></div>
  <div class="larga"><button type="submit">Salvar</button>
    <a class="botao secundario" href="{{if .IsNew}}/agenda{{else}}/agenda/{{.ID}}{{end}}">Cancelar</a></div>
</form>
{{end}}{{end}}
