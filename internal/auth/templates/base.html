{{define "base"}}<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} · Painel Teodoro</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
{{if .Role}}
<header class="topo">
  <a class="marca" href="/">Painel Teodoro</a>
  <nav aria-label="Principal">
    <a href="/">Hoje</a>
    {{if .CanAudit}}<a href="/admin/auditoria">Auditoria</a>{{end}}
  </nav>
  <form method="post" action="/logout" class="sair">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <span class="quem">{{.Email}} · {{.Role}}</span>
    <button type="submit" class="secundario">Sair</button>
  </form>
</header>
{{end}}
<main id="conteudo" class="{{if .Role}}pagina{{else}}cartao{{end}}">
{{template "content" .}}
</main>
</body>
</html>{{end}}
