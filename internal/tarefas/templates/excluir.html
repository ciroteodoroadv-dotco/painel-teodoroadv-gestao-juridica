{{define "excluir"}}<h2>Excluir tarefa</h2>
    <p class="drawer-sub">Excluir esta tarefa? Ela deixa de aparecer nas listas e a exclusão fica registrada na auditoria. Confirme com a sua senha.</p>
    <form data-drawer-form method="post" action="/tarefas/{{.T.ID}}/excluir">
      <input type="hidden" name="version" value="{{.T.Version}}">
      <div class="field"><label>Sua senha *</label><input type="password" name="senha" autocomplete="current-password" required></div>
      <div class="drawer-actions">
        <button type="button" class="btn btn-ghost" data-drawer-fechar>Cancelar</button>
        <button type="submit" class="btn btn-primary">Excluir</button>
      </div>
    </form>{{end}}
