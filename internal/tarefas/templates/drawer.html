{{define "drawer"}}{{with .Data}}<h2 id="drawer-titulo">{{if .IsNew}}Nova tarefa{{else}}Editar tarefa{{end}}</h2>
<p class="drawer-sub">O vencimento é o que você informa: o sistema não calcula prazo processual.</p>
{{if $.Error}}<p class="form-error" role="alert">{{$.Error}}</p>{{end}}
<form method="post" action="{{if .IsNew}}/tarefas{{else}}/tarefas/{{.ID}}{{end}}"
      hx-post="{{if .IsNew}}/tarefas{{else}}/tarefas/{{.ID}}{{end}}" hx-target="#drawer-corpo" hx-swap="innerHTML">
  <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
  {{if not .IsNew}}<input type="hidden" name="version" value="{{.Version}}">{{end}}
  <div class="field"><label for="d-titulo">Título</label>
    <input id="d-titulo" name="titulo" type="text" value="{{.In.Titulo}}" required minlength="2" maxlength="300"></div>
  <div class="field"><label for="d-subtitulo">Subtítulo <span class="hint">(opcional; ex.: Ligação, Reunião, Aula)</span></label>
    <input id="d-subtitulo" name="subtitulo" type="text" value="{{.In.Subtitulo}}" maxlength="80"></div>
  <div class="row2">
    <div class="field"><label for="d-vencimento">Vencimento</label>
      <input id="d-vencimento" name="vencimento" type="date" value="{{.In.Vencimento}}"></div>
    <div class="field"><label for="d-prioridade">Prioridade</label>
      <select id="d-prioridade" name="prioridade">
        {{$p := .In.Prioridade}}{{range .Prioridades}}<option value="{{.Valor}}" {{if eq .Valor $p}}selected{{end}}>{{.Rotulo}}</option>{{end}}
      </select></div>
  </div>
  <div class="row2">
    <div class="field"><label for="d-status">Situação</label>
      <select id="d-status" name="status" required>
        {{$s := .In.Status}}{{range .Statuses}}<option value="{{.Valor}}" {{if eq .Valor $s}}selected{{end}}>{{.Rotulo}}</option>{{end}}
      </select></div>
    <div class="field"><label for="d-responsavel">Responsável</label>
      <select id="d-responsavel" name="responsavel_id">
        <option value="">— sem responsável —</option>
        {{$r := .In.ResponsavelID}}{{range .Responsaveis}}<option value="{{.Valor}}" {{if eq .Valor $r}}selected{{end}}>{{.Rotulo}}</option>{{end}}
      </select></div>
  </div>
  <div class="field"><label for="d-busca">Processo <span class="hint">(opcional)</span></label>
    <input id="d-busca" name="busca" type="search" autocomplete="off" placeholder="buscar por número ou órgão"
           hx-get="/tarefas/processos" hx-trigger="input changed delay:300ms, search" hx-target="#d-processo"></div>
  <div class="field">
    <select id="d-processo" name="processo_id" aria-label="Processo">
      {{if .In.ProcessoID}}<option value="{{.In.ProcessoID}}" selected>{{.ProcessoNum}}</option>{{end}}
      <option value="">— sem processo —</option>
    </select></div>
  <div class="drawer-actions">
    <button type="button" class="btn btn-ghost" data-drawer-fechar>Cancelar</button>
    <button type="submit" class="btn btn-primary">Salvar</button>
  </div>
</form>
{{end}}{{end}}
