# Entrega: ao criar uma tag vX.Y.Z, constrói a imagem, gera o SBOM, varre vulnerabilidades e publica POR DIGEST.
# NÃO foi executado ainda (o repositório não tem remoto). As ações estão fixadas por tag; fixe por hash antes de produção.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir (sem publicar) para varrer antes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: painel:varredura
      - name: Varredura de vulnerabilidades (falha em CRÍTICA/ALTA com correção disponível)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: painel:varredura
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: painel:varredura
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Publicar
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/painel:${{ github.ref_name }}
          provenance: true
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.spdx.json }
      - name: Resumo (copie o DIGEST para o deploy.sh)
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/${{ github.repository }}/painel@${{ steps.push.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: \`./oracle/deploy.sh ghcr.io/${{ github.repository }}/painel@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
