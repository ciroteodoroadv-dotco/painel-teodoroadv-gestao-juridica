name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Formatação
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Análise estática
        run: go vet ./...
      - name: Testes
        run: go test -race -count=1 ./...
      - name: Limite de 300 linhas
        run: ./scripts/check-lines.sh
      - name: Vulnerabilidades
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Segredos no Git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar segredos descartáveis do CI
        run: ./deploy/gerar-segredos.sh
      - name: Validar o Compose
        run: docker compose -f deploy/docker-compose.yml config -q
      - name: Construir a imagem (sem publicar)
        run: docker build -f deploy/Dockerfile -t painel:ci .
